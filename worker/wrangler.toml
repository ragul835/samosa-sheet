name = "samosa-sheet-enquiries"
main = "src/index.js"
compatibility_date = "2026-09-06"
workers_dev = false

[[routes]]
pattern = "api.samosasheet.com"
custom_domain = true

[[queues.producers]]
binding = "ENQUIRY_QUEUE"
queue = "samosa-sheet-enquiries"

[[queues.consumers]]
queue = "samosa-sheet-enquiries"
dead_letter_queue = "samosa-sheet-enquiries-dlq"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 5
retry_delay = 60

[vars]
ALLOWED_ORIGINS = "https://samosasheet.com,https://www.samosasheet.com"
FROM_EMAIL = "Samosa Sheet Website <website@mail.samosasheet.com>"
TO_EMAIL = "orders@samosasheet.com"
